; 配置示例
; 注: 命令中直接输入的选项优先级高于配置文件
;     布尔型的设置仅当为true时才为真

; 通用配置节点
[config]
; 默认输出格式，当下面的format节点没有指定格式时使用该值，最好不要在[config]中设置
format = pac
; PAC文件中的代理，默认为空
pac-proxy = "SOCKS5 127.0.0.1:1080; HTTP localhost:1087; HTTPS localhost:1087"

; 获取gfwlist时的代理
gfwlist-proxy = SOCKS5 127.0.0.1:1089;

; gfwlist文件网址，留空使用默认，值为`-`则表示不在线获取
; gfwlist-url = https://raw.githubusercontent.com/gfwlist/gfwlist/master/gfwlist.txt

; gfwlist本地文件，在线地址获取失败时读取本地
gfwlist-local = ~/git-repo/conf/genpac/pac.txt

; 更新本地gfwlist文件 默认 false
; 当成功获取在线的gfwlist文件并且gfwlist-local存在，是否更新gfwlist-local
gfwlist-update-local = true

; 保存解码后的gfwlist文件 用于开发测试
gfwlist-decoded-save = ~/git-repo/conf/genpac/pac-dec.txt

; 规则文件，可使用`,`或换行分割多个文件
user-rule-from = ~/git-repo/conf/genpac/user-rule.txt

; 输出文件 该值为空或`-`则输出到stdout
output = autoproxy.pac

